# Deploys the Cloud Function. A Cloud Build trigger points at this file with
# _REGION set; by hand it is the same build:
#   gcloud builds submit --config=packages/examples/google/fetch/cloudbuild.yaml .
substitutions:
  _REGION: us-central1

steps:
  # The workspace, the adapter, and the bundle the runtime executes.
  - name: oven/bun:1.4-slim
    entrypoint: bash
    args:
      - -c
      - bun install --frozen-lockfile && bun run build:core && bun run --cwd packages/examples/google/fetch bundle

  # The upload is dist/, which carries the bundle and a manifest without
  # dependencies: the Node buildpack runs npm install and cannot read workspace:*.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - >
        gcloud functions deploy ailura-nestjs-hono-google-fetch --gen2 --runtime=nodejs22
        --project=$PROJECT_ID --region=${_REGION}
        --source=packages/examples/google/fetch/dist --entry-point=handler
        --trigger-http --allow-unauthenticated --quiet
        && gcloud run services add-iam-policy-binding ailura-nestjs-hono-google-fetch
        --project=$PROJECT_ID --region=${_REGION}
        --member=allUsers --role=roles/run.invoker --quiet

options:
  logging: CLOUD_LOGGING_ONLY
