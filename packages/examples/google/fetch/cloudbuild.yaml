# Deploys the Cloud Function. A Cloud Build trigger points at this file with
# _REGION set; by hand it is the same build:
#   gcloud builds submit --config=packages/examples/google/fetch/cloudbuild.yaml .
substitutions:
  _REGION: us-central1

steps:
  # Decide whether this deployment is affected. The same check is used by
  # local tooling; if Git history is unavailable the build is allowed.
  - name: oven/bun:1.4-slim
    entrypoint: bash
    args:
      - -c
      - |
        if ! bun run scripts/ignore-build.ts --server google --target fetch --base HEAD^ --head HEAD -- packages/examples/google/fetch/ packages/core/src/ packages/core/package.json packages/core/tsconfig.json packages/core/tsconfig.build.json package.json bun.lock tsconfig.json bunfig.toml; then
          touch /workspace/.deploy-google-fetch
        fi

  # The workspace, the adapter, and the bundle the runtime executes.
  - name: oven/bun:1.4-slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ ! -f /workspace/.deploy-google-fetch ]; then
          echo 'Skipping unaffected Cloud Functions deployment.'
          exit 0
        fi
        bun install --frozen-lockfile && bun run build:core && bun run --cwd packages/examples/google/fetch bundle

  # The upload is dist/, which carries the bundle and a manifest without
  # dependencies: the Node buildpack runs npm install and cannot read workspace:*.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ ! -f /workspace/.deploy-google-fetch ]; then
          echo 'Skipping unaffected Cloud Functions deployment.'
          exit 0
        fi
        gcloud functions deploy ailura-nestjs-hono-google-fetch --gen2 --runtime=nodejs22 --project=$PROJECT_ID --region=${_REGION} --source=packages/examples/google/fetch/dist --entry-point=handler --trigger-http --allow-unauthenticated --quiet && gcloud run services add-iam-policy-binding ailura-nestjs-hono-google-fetch --project=$PROJECT_ID --region=${_REGION} --member=allUsers --role=roles/run.invoker --quiet

# Cloud Logging alone, so gcloud prints nothing: gcloud builds log <id> --region=<region>
options:
  logging: CLOUD_LOGGING_ONLY
