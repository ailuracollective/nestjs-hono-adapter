---
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit is advisory here. The contribution gate is `ailuracollective/actions`
# (`.github/workflows/policy.yml`) and `bun run check` (`.github/workflows/ci.yml`);
# this file reviews content and cross-file invariants only. The layer map, the frozen
# `node:` builtin set and the bundle ceilings are in `docs/architecture.md`.

# Cite the invariant a change would break, with evidence.
tone_instructions: >-
  Be precise and evidence based. Cite the invariant a change would break: a dependency rule, the frozen `node:` builtin set, a bundle ceiling or the compatibility region's caps. Prefer a counter-example to praise; a green linter is not verification.

reviews:
  # No diagrams on a library repository.
  sequence_diagrams: false

  # CODEOWNERS assigns reviewers; the label set is `.github/labels.yml`.
  suggested_reviewers: false
  suggested_labels: false

  auto_review:
    # Dependency updates are reviewed by CI, not by CodeRabbit.
    ignore_usernames:
      - 'dependabot[bot]'
    # release-please pull requests: the gate exempts them by head ref, which CodeRabbit
    # cannot match, so skip them by the label release-please applies.
    labels:
      - '!release/pending'

  # Generated and machine-owned files.
  path_filters:
    # `bun run build` writes these.
    - '!**/dist/**'
    - '!**/*.tsbuildinfo'
    # release-please writes the changelog and the manifest on every release.
    - '!CHANGELOG.md'
    - '!.release-please-manifest.json'
    # `bun run bench` overwrites this page on every run; the formatter ignores it too.
    - '!docs/benchmarks.md'
    # Raw benchmark samples: git-ignored, regenerated by the suite.
    - '!packages/benchmarks/results/**'
    # Written by `bun install`; the version stays 1 and CI checks it in its own job.
    - '!bun.lock'

  path_instructions:
    - path: 'packages/core/src/**'
      instructions: |
        Five dependency rules, all enforced by `test/layers.test.ts`: `core/` never reaches
        `features/` except from `core/server/hono-lifecycle.ts` and
        `core/server/server-adapter.ts`; `features/` never reaches another feature and
        never reaches a bridge package; the upload island reaches the application only as
        the published package, never as an internal path; `core/` reaches `compat/` only
        from the two composition roots, plus `core/route/handler-bridge/request.ts` naming
        `compat/express/surface.ts`.

        A parent-relative import is refused: each tree is named by an alias (`#adapter/*`,
        `#multipart/*`, `#adapter-test/*`, `#multipart-test/*`, `#test/*`, `#root/*`), a
        sibling travels as `./sibling.ts`, and an alias carries no `.ts`.

        Flag any `node:` builtin outside the frozen eight (`node:buffer`, `node:events`,
        `node:fs/promises`, `node:http`, `node:https`, `node:path`, `node:stream`,
        `node:util`), and any module other than `servers/node.ts` that builds an
        `http.Server`. The import order in `core/server/server-adapter.ts` and
        `core/server/hono-lifecycle.ts` is load-bearing for the bundle size: do not
        alphabetise it. `compat/**` caps at 100 lines and at most two lines of comment,
        because the reasoning lives in `docs/compatibility.md`.
    - path: 'packages/{ws,socket-io,graphql,serve-static}/src/**'
      instructions: |
        A compatibility bridge, small on purpose: its `src/` caps at 100 lines and a
        comment is at most two lines, because the reasoning lives in
        `docs/compatibility.md`. It reaches the adapter only through the published
        entrypoint (`@ailura/nestjs-hono-adapter`), never `#adapter/`. It imports no
        `node:` builtin and names no runtime: it reads files through
        `transport.serveStatic()`. Nothing here is imported by an application —
        `compat/registry/discover.ts` resolves the package by name, so installing it is
        what installs the bridge.
    - path: 'packages/multipart/src/**'
      instructions: |
        The upload island: the one package that consumes `multipart/form-data` and the one
        that depends on `busboy`. It imports `declareMultipart`, the single symbol the core
        publishes for it, as a value and reaches the core otherwise as types only. It sits
        outside the core's frozen `node:` set and may reach `node:crypto`, `node:fs`,
        `node:os` and `node:stream/promises` beyond the eight. Do not move
        `FileStreamInterceptor` out of `interceptors/file.interceptor.ts`: the region takes
        the repository's widest `.oxlintrc.json` exceptions on purpose.
    - path: 'packages/*/.size-limit.json'
      instructions: |
        The size gate is a product constraint: CI fails when a ceiling is exceeded, so the
        ceilings are ratchets. A raise is an explicit edit justified in the bundle budget
        in `docs/architecture.md`, not a quiet bump. Warn when a change raises a ceiling
        without a matching edit to that page. Extracting a helper costs bytes; moving code
        is free.
    - path: 'test/**'
      instructions: |
        The guards over the monorepo: `layers.test.ts` holds the six dependency rules,
        `entry-points.test.ts` the subpath isolation and the manifest declarations, and
        `node-builtins.test.ts` the frozen builtin set — freezing a new one is a deliberate
        edit to both the source and the test. A package's behaviour tests live in
        `packages/<name>/test/`, not here. These files carry a 700-line ceiling, not 400.
    - path: 'docs/**'
      instructions: |
        A change to public behavior, configuration or a rule updates the documentation in
        the same change. `architecture.md` holds the layer map, the frozen builtin set and
        the bundle ceilings; a rule edited in `AGENTS.md` must be reflected here, and the
        compatibility region's rules in `docs/compatibility.md`. Do not hand-edit
        `docs/benchmarks.md`: `bun run bench` overwrites it.
    - path: '*.md'
      instructions: |
        `AGENTS.md` holds this repository's invariants, links the organisation conventions
        and never restates them; `README.md` is the human entry point. Prefer a link to an
        existing rule over a duplicated paragraph.
    - path: '.github/labels.yml'
      instructions: |
        Each entry has exactly `name`, `color`, `description`, in that order. Colors are
        quoted six-digit hex without `#`. Families follow the order type, status, scope,
        meta, github_actions, release; `type/` is frozen at five members. Flag an invented
        or renamed label, an unquoted color, or a re-sorted family. `release/pending` and
        `release/tagged` are read by `release-please-config.json`: do not drop them.
    - path: '.github/standards.local.yml'
      instructions: |
        A declaration, not configuration: no workflow reads it, so a value here changes no
        behaviour. Every override, drop and structural entry needs a `reason`, and a
        level-3 deviation also names the issue that approved it. Flag a deviation recorded
        here that the repository does not actually make, and a repository change that
        departs from the standard without an entry here.
    - path: '.github/workflows/**'
      instructions: |
        Every job sets `timeout-minutes: 10` and declares only the permissions it needs.
        Checkout sets `persist-credentials: false` unless credentials are required. A job
        that runs code from a pull-request head must never receive secrets, and `policy.yml`
        must keep checking out the base branch. Do not replace the release-PR exemption by
        head ref with `skip-actors`, and keep `AILURA_PR_COMPLIANCE_TOKEN` and
        `AILURA_RELEASE_TOKEN` separate.
    - path: '.github/PULL_REQUEST_TEMPLATE/**'
      instructions: |
        The filenames are the allowed title types, read by `policy.yml` as `title-types`
        minus `breaking-change`; a title type has no branch type of its own. Common
        headings are `## Linked issue`, `## Summary`, `## Changes` and `## Verification`,
        and `## Verification` asks for evidence, not commands CI already runs. The body
        check resolves the template from the title type, so a new filename is also a
        `.github/workflows/policy.yml` edit.
    - path: 'release-please-config.json'
      instructions: |
        Six packages release: `packages/core` plus `socket-io`, `ws`, `multipart`,
        `graphql` and `serve-static`. `packages/benchmarks`, `packages/compatibility` and
        `packages/examples` are private and must never gain a release entry. `label` and
        `release-label` name `.github/labels.yml`'s `release/pending` and `release/tagged`.
    - path: 'packages/*/package.json'
      instructions: |
        A published package's `version` mirrors `.release-please-manifest.json`, which
        release-please reads as the last release and overwrites on the next one: do not
        hand-edit it. A capability or bridge package peers on the adapter (`>=1.4.1 <2`),
        and the adapter names none of them in `dependencies`, `optionalDependencies` or
        `peerDependencies`; `test/entry-points.test.ts` holds that direction.
    - path: 'packages/{benchmarks,compatibility,examples}/**'
      instructions: |
        Private and never published: no release entry, absent from
        `release-please-config.json`, `.github/workflows/publish.yml` and the size gate.
        `packages/benchmarks` is outside `bun run check` and runs by hand with
        `bun run bench`; `packages/compatibility` runs under `bun run check`, and the CI
        matrix runs it on Nest 11 and 12, where the three packages that peer `^12` alone
        are removed and their cases skip rather than fail to load. `packages/examples`
        holds independent Cloudflare projects, excluded from lint and format.

  # The gate owns the pull-request contract; only cross-file invariants are advisory here.
  pre_merge_checks:
    docstrings:
      mode: 'off'
    title:
      mode: 'off'
    description:
      mode: 'off'
    issue_assessment:
      mode: 'off'
    custom_checks:
      - name: 'Cross-file invariants'
        mode: 'warning'
        instructions: |
          Warn when a change edits one side of a documented cross-file invariant without the
          other. The invariants are: `.github/PULL_REQUEST_TEMPLATE/` filenames <->
          `policy.yml`'s `title-types`; `policy.yml`'s `type-labels` <->
          `.github/labels.yml`'s `type/` family; `release-please-config.json` <->
          `.release-please-manifest.json` (the package set and each version);
          `release-please-config.json`'s `label`/`release-label` <->
          `.github/labels.yml`'s `release/pending`/`release/tagged`; a `.size-limit.json`
          ceiling <-> the bundle budget in `docs/architecture.md`; `AGENTS.md` <->
          `docs/architecture.md`; `.github/CODEOWNERS` <-> repository permissions; required
          status checks <-> workflow job names; and the guards <-> the rules they hold
          (`test/layers.test.ts` <-> the dependency rules, `test/node-builtins.test.ts` <->
          the frozen builtin set). A green linter is not verification.

  # Read-only: no edits to a pull request, and no follow-up ones. `simplify` is off by
  # default and stays off.
  finishing_touches:
    autofix:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  # One failure, one owner: `bun run check` is the linter of record — oxlint, oxfmt,
  # `tsc`, `bun test` and size-limit. CodeRabbit's TypeScript linters would be a second
  # owner of the same files.
  tools:
    # `bun run lint` (oxlint) and `bun run format:check` (oxfmt) own these files.
    oxc:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    # Languages and artifacts this repository does not carry.
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    hadolint:
      enabled: false
    checkov:
      enabled: false
    tflint:
      enabled: false
    # CI runs no YAML, Markdown, workflow or shell linter, so yamllint, markdownlint,
    # actionlint and shellcheck stay at their default. Security scanners CI does not run
    # stay enabled too: zizmor, gitleaks, trufflehog, semgrep.
