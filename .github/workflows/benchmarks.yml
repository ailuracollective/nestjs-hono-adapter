name: Benchmarks

'on':
  workflow_dispatch:
  schedule:
    # A weekly smoke, so a broken harness is noticed without a
    # blocking performance gate. See packages/benchmarks/README.md.
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install oha
        run: |
          curl -Ls https://github.com/hatoo/oha/releases/latest/download/oha-linux-amd64 -o oha
          chmod +x oha
          sudo mv oha /usr/local/bin/oha
          oha --version
      - run: bun install --frozen-lockfile
      - name: Run a short comparison
        run: |
          cd packages/benchmarks
          bun run build
          bun dist/harness/run.js --targets=bun,node,express,fastify --scenarios=json --duration=3 --warmup=1 --runs=1
      - name: Upload the raw samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: packages/benchmarks/results/
          if-no-files-found: ignore
