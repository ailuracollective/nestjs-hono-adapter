---
name: publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # release-please cuts one independent release per package, so nothing
      # here or in release-please-config.json enforces the one order that
      # matters: core before the root and before the three capability
      # packages that peer on it.
      - name: Resolve the released package
        id: package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$TAG" in
            socket-io-v*) echo "dir=./packages/socket-io" >> "$GITHUB_OUTPUT" ;;
            ws-v*) echo "dir=./packages/ws" >> "$GITHUB_OUTPUT" ;;
            multipart-v*) echo "dir=./packages/multipart" >> "$GITHUB_OUTPUT" ;;
            core-v*) echo "dir=./packages/core" >> "$GITHUB_OUTPUT" ;;
            v*) echo "dir=." >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::no package is configured for tag '$TAG'"
              exit 1
              ;;
          esac
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Guard build output
        env:
          DIR: ${{ steps.package.outputs.dir }}
        run: |
          if [ -z "$(ls -A "$DIR/dist" 2>/dev/null)" ]; then
            echo "::error::'$DIR/dist' is missing or empty; the build step produced no output."
            exit 1
          fi
      - name: Publish to npm
        run:
          npm publish "${{ steps.package.outputs.dir }}"
          --provenance
