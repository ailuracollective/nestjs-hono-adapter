name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `check` and the `compat` matrix are required checks. A skipped job reports
  # "Success", so a change that touches no code can skip CI — but a skipped
  # *matrix* job reports no contexts at all, so `compat` gates its steps rather
  # than the job. Drafts are skipped here too. See
  # docs.github.com/actions/using-jobs/using-conditions-to-control-job-execution
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: check
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          # The base for a pull request, the previous commit for a push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE...HEAD" -- \
            src test benchmark examples \
            package.json bun.lock bunfig.toml tsconfig.json \
            .oxlintrc.json .oxfmtrc.json .size-limit.json \
            .github/workflows 2>/dev/null; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  size:
    needs: preflight
    if: needs.preflight.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run size

  compat:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        nest: ['11', '12']
        node: ['22', '24']
    steps:
      - if: needs.preflight.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - if: needs.preflight.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2
      - if: needs.preflight.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - if: needs.preflight.outputs.run == 'true'
        run: |
          bun install --frozen-lockfile
          bun add --exact \
            @nestjs/common@${{ matrix.nest }}.x \
            @nestjs/core@${{ matrix.nest }}.x \
            @nestjs/websockets@${{ matrix.nest }}.x \
            @nestjs/microservices@${{ matrix.nest }}.x
          bun run typecheck && bun test && bun run build
