name: CI

"on":
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'tsconfig.json'
      - '.size-limit.json'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "check"
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        nest: ['11', '12']
        node: ['22', '24']
    steps:
      - run: echo "compat"
