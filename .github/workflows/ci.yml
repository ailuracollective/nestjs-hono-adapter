name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm is pinned to the version this repository is developed
      # against: the lockfile only means something under the pnpm that
      # wrote it, so CI must not quietly resolve a different one.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  # The bundle size is the product constraint, so it is a gate
  # and not a report. The action bundles each public entrypoint
  # the way a consumer would, fails when a ceiling in
  # `.size-limit.json` is exceeded, and comments the delta on the
  # pull request that caused it.
  size:
    runs-on: ubuntu-latest
    # The comment is the part the action adds over a plain run.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      # The action runs its own install, so this job never installs
      # by hand, but it does shell out to pnpm to do it and to
      # build: `ubuntu-latest` ships node, not pnpm.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: andresz1/size-limit-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: build
          package_manager: pnpm

  # The bundle size is the product constraint, so it is a gate and
  # not a report: each public entrypoint is bundled the way a
  # consumer resolves it, and this job fails when a ceiling in
  # `.size-limit.json` is exceeded.
  #
  # The `andresz1/size-limit-action` is deliberately not used here. It
  # measures the pull request's base branch in the same job, and that
  # branch has to be measurable on its own, so the pull request that
  # introduces these ceilings cannot use it: its base has neither the
  # config nor the dependency. It also only works on `pull_request`
  # events and picks its package manager from the lockfile. Four steps
  # that say what they do are worth more here than a delta comment.
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # The ceilings are exact bytes. `ws` has none; `index` carries
      # a few, put there when the layer work needed them, so growth
      # stays a decision rather than an accident. What gets measured
      # also has to be the tree the lockfile describes: an unresolved
      # one can move the number with no source change.
      - run: bun install --frozen-lockfile
      - run: bun run size

  # Every Nest package moves together: a mixed install is what a
  # WebSocket or microservice case would fail on, not the adapter.
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nest: ['11', '12']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm install --frozen-lockfile
      - run:
          pnpm add --save-exact @nestjs/common@${{ matrix.nest
          }}.x @nestjs/core@${{ matrix.nest }}.x
          @nestjs/websockets@${{ matrix.nest }}.x
          @nestjs/microservices@${{ matrix.nest }}.x
      - run:
          pnpm run typecheck && pnpm run test && pnpm run build
