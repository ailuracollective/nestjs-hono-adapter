name: CI

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'packages/**'
      - 'test/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'codecov.yml'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'packages/**'
      - 'test/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'codecov.yml'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint && bun run format:check && bun run typecheck && bun run build
      - run: bun test --coverage --coverage-reporter=lcov
      - run: bun run size
      - uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  compat:
    # Every Nest package moves together: a mixed install is what a WebSocket,
    # microservice or bridge case would fail on, not the adapter. A bridge
    # package's peers move with the matrix too, and their majors are not the
    # core's — `@nestjs/graphql`/`@nestjs/apollo` are core + 2 and
    # `@nestjs/serve-static` is 5 for the 11 line and 12 for the 12 line.
    #
    # Of the third-party packages the suite exercises, only `@nestjs/cqrs` and
    # `@nestjs/swagger` need moving: their installed majors peer on `^12` and
    # nothing else. The rest — `cache-manager`, `config`, `event-emitter`,
    # `jwt`, `passport`, `schedule`, `terminus`, `throttler` — already peer
    # `^11 || ^12`, so the lockfile's version is the right one on both lines.
    #
    # `packages/compatibility` holds the third-party packages the adapter runs
    # alongside — the ones it had never met and the behaviour suites moved out
    # of the core. Most peer `^11 || ^12`, so they stay put. Three do not:
    # `@nestjs/devtools-integration`, `@nestjs/authentication` and
    # `@nestjs/authorization` peer `^12` alone, so the 11 line removes them from
    # that package and its suite skips them — a Nest major they never claimed is
    # not an adapter failure. The suite runs on Bun.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - nest: '11'
            nestGraphql: '^13.x'
            nestServeStatic: '^5.x'
            nestThirdParty: '@nestjs/cqrs@^11.x @nestjs/swagger@^11.x'
          - nest: '12'
            nestGraphql: '^14.x'
            nestServeStatic: '^12.x'
            nestThirdParty: '@nestjs/cqrs@^12.x @nestjs/swagger@^12.x'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-compat-${{ matrix.nest }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-compat-${{ matrix.nest }}-
      - uses: oven-sh/setup-bun@v2
      - if: matrix.nest == '11'
        working-directory: packages/compatibility
        run: bun remove @nestjs/devtools-integration @nestjs/authentication @nestjs/authorization
      - run: bun add @nestjs/common@^${{ matrix.nest }}.x @nestjs/core@^${{ matrix.nest }}.x @nestjs/websockets@^${{ matrix.nest }}.x @nestjs/platform-ws@^${{ matrix.nest }}.x @nestjs/platform-socket.io@^${{ matrix.nest }}.x @nestjs/graphql@${{ matrix.nestGraphql }} @nestjs/apollo@${{ matrix.nestGraphql }} @nestjs/serve-static@${{ matrix.nestServeStatic }}
      - working-directory: packages/compatibility
        run: bun add @nestjs/common@^${{ matrix.nest }}.x @nestjs/core@^${{ matrix.nest }}.x @nestjs/websockets@^${{ matrix.nest }}.x @nestjs/microservices@^${{ matrix.nest }}.x @nestjs/testing@^${{ matrix.nest }}.x ${{ matrix.nestThirdParty }}
      - run: bun update @nestjs/common @nestjs/core @nestjs/websockets @nestjs/platform-ws @nestjs/platform-socket.io @nestjs/graphql @nestjs/apollo @nestjs/serve-static
      - working-directory: packages/compatibility
        run: bun update @nestjs/common @nestjs/core @nestjs/websockets @nestjs/microservices @nestjs/testing @nestjs/cqrs @nestjs/swagger
      - run: rm -rf node_modules packages/*/node_modules packages/examples/cloudflare/*/node_modules && bun install
      - run: bun run typecheck && bun run build && bun test
