name: CI

"on":
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'tsconfig.json'
      - '.size-limit.json'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'tsconfig.json'
      - '.size-limit.json'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  size:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run size

  compat:
    # Every Nest package moves together: a mixed install is what a WebSocket or
    # microservice case would fail on, not the adapter.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        nest: ['11', '12']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run:
          bun add --exact @nestjs/common@${{ matrix.nest }}.x
          @nestjs/core@${{ matrix.nest }}.x
          @nestjs/websockets@${{ matrix.nest }}.x
          @nestjs/microservices@${{ matrix.nest }}.x
      - run: bun run typecheck && bun test && bun run build
