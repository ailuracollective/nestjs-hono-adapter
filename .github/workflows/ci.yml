name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  # The bundle size is the product constraint, so it is a gate
  # and not a report. The action bundles each public entrypoint
  # the way a consumer would, and fails when a ceiling in
  # `.size-limit.json` is exceeded.
  size:
    runs-on: ubuntu-latest
    # The delta comment on the pull request is the part the action
    # adds over a plain run, and it is why this job asks for a
    # permission the rest of the workflow does not.
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # The ceilings in `.size-limit.json` are exact bytes with no
      # headroom, and a tree resolved outside the lockfile can move
      # that number without a single source change. Install from the
      # lockfile here and tell the action to skip its own install,
      # so what gets measured is the tree the lockfile describes.
      - run: bun install --frozen-lockfile
      # Pinned to the release, not to `@v1`: that tag still points at
      # the 2020 build, which runs on node12 and declares a smaller set
      # of inputs than the one documented here.
      - uses: andresz1/size-limit-action@v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Two lockfiles are tracked while the toolchain migration is
          # in flight, and auto-detection reads `pnpm-lock.yaml` and
          # picks pnpm. This job measures a bun install, so the manager
          # is named instead of inferred.
          package_manager: bun
          build_script: build
          skip_step: install
          # The default is `npx size-limit --json`, and npm resolves
          # that against its own view of the tree: it does not find the
          # binary this job installed, fetches a bare copy, and that
          # copy cannot see the preset, so it prints help where the
          # action expects JSON. Asking the same manager that built
          # the tree to run it avoids the second resolution entirely.
          script: bunx size-limit --json

  # Every Nest package moves together: a mixed install is what a
  # WebSocket or microservice case would fail on, not the adapter.
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nest: ['11', '12']
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run:
          bun add --exact @nestjs/common@${{ matrix.nest }}.x
          @nestjs/core@${{ matrix.nest }}.x
          @nestjs/websockets@${{ matrix.nest }}.x
          @nestjs/microservices@${{ matrix.nest }}.x
      - run: bun run typecheck && bun test && bun run build
