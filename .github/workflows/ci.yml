name: CI

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'packages/**'
      - 'test/**'
      - 'docs/**'
      - 'README.md'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'packages/**'
      - 'test/**'
      - 'docs/**'
      - 'README.md'
      - 'tsconfig.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  lockfile:
    # `bun.lock` is JSON with comments, so the version is parsed rather than
    # matched line by line. The file is pinned to the format the Cloudflare
    # build image reads; the `bun.lock` path filter above is what makes this
    # job run exactly when the lockfile changes. See docs/development.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Check the lockfile format
        run: |
          bun --eval '
            const text = await Bun.file("bun.lock").text();
            const version = Bun.JSONC.parse(text).lockfileVersion;
            if (version !== 1) {
              console.error(`bun.lock is lockfileVersion ${version}; the repository pins version 1. See docs/development.md#the-lockfile-format-the-build-image-reads.`);
              process.exit(1);
            }
            console.log("bun.lock is lockfileVersion 1.");
          '

  size:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run size

  compat:
    # Every Nest package moves together: a mixed install is what a WebSocket,
    # microservice or bridge case would fail on, not the adapter. A bridge
    # package's peers move with the matrix too, and their majors are not the
    # core's — `@nestjs/graphql`/`@nestjs/apollo` are core + 2 and
    # `@nestjs/serve-static` is 5 for the 11 line and 12 for the 12 line.
    #
    # Of the third-party packages the suite exercises, only `@nestjs/cqrs` and
    # `@nestjs/swagger` need moving: their installed majors peer on `^12` and
    # nothing else. The rest — `cache-manager`, `config`, `event-emitter`,
    # `jwt`, `passport`, `schedule`, `terminus`, `throttler` — already peer
    # `^11 || ^12`, so the lockfile's version is the right one on both lines.
    # The suite runs on Bun.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - nest: '11'
            nestGraphql: '13'
            nestServeStatic: '5'
            nestThirdParty: '@nestjs/cqrs@11 @nestjs/swagger@11'
          - nest: '12'
            nestGraphql: '14'
            nestServeStatic: '12'
            nestThirdParty: '@nestjs/cqrs@12 @nestjs/swagger@12'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun add --exact @nestjs/common@${{ matrix.nest }}.x @nestjs/core@${{ matrix.nest }}.x @nestjs/websockets@${{ matrix.nest }}.x @nestjs/platform-ws@${{ matrix.nest }}.x @nestjs/platform-socket.io@${{ matrix.nest }}.x @nestjs/microservices@${{ matrix.nest }}.x @nestjs/testing@${{ matrix.nest }}.x @nestjs/graphql@${{ matrix.nestGraphql }} @nestjs/apollo@${{ matrix.nestGraphql }} @nestjs/serve-static@${{ matrix.nestServeStatic }} ${{ matrix.nestThirdParty }}
      - run: bun run typecheck && bun run build && bun test
