name: CI

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'packages/**'
      - 'test/**'
      - 'tsconfig.json'
      - '.size-limit.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'packages/**'
      - 'test/**'
      - 'tsconfig.json'
      - '.size-limit.json'
      - '.oxfmtrc.json'
      - '.oxlintrc.json'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  lockfile:
    # `bun.lock` is JSON with comments, so the version is parsed rather than
    # matched line by line. The file is pinned to the format the Cloudflare
    # build image reads; the `bun.lock` path filter above is what makes this
    # job run exactly when the lockfile changes. See docs/development.md.
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Check the lockfile format
        run: |
          bun --eval '
            const text = await Bun.file("bun.lock").text();
            const version = Bun.JSONC.parse(text).lockfileVersion;
            if (version !== 1) {
              console.error(`bun.lock is lockfileVersion ${version}; the repository pins version 1. See docs/development.md#the-lockfile-format-the-build-image-reads.`);
              process.exit(1);
            }
            console.log("bun.lock is lockfileVersion 1.");
          '

  size:
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run size

  compat:
    # Every Nest package moves together: a mixed install is what a WebSocket or
    # microservice case would fail on, not the adapter. The suite runs on Bun.
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        nest: ['11', '12']
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run:
          bun add --exact @nestjs/common@${{ matrix.nest }}.x
          @nestjs/core@${{ matrix.nest }}.x
          @nestjs/websockets@${{ matrix.nest }}.x
          @nestjs/microservices@${{ matrix.nest }}.x
          @nestjs/testing@${{ matrix.nest }}.x
      - run: bun run typecheck && bun test && bun run build
