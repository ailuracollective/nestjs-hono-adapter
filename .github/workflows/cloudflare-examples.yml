---
name: Cloudflare examples

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-examples.yml'
      - 'examples/**'
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/cloudflare-examples.yml'
      - 'examples/**'
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group:
    cloudflare-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: ${{ matrix.example }}
    # A pull request from a fork has no secrets to deploy with.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        example: [node, fetch]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Deploy ${{ matrix.example }}
        id: cf
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Workers Previews need wrangler >= 4.136.3; the repo pins 4.136.2.
          wranglerVersion: '4.149.0'
          workingDirectory:
            examples/cloudflare/${{ matrix.example }}
          packageManager: bun
          command:
            ${{ github.event_name == 'pull_request' &&
            format('preview --name pr-{0}',
            github.event.pull_request.number) || 'deploy' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          PREVIEW_URL: ${{ steps.cf.outputs.preview-url }}
          PREVIEW_DEPLOYMENT_URL:
            ${{ steps.cf.outputs.preview-deployment-url }}
          EXAMPLE: ${{ matrix.example }}
        with:
          script: |
            const marker = `<!-- cloudflare-examples:${process.env.EXAMPLE} -->`;
            const url = process.env.PREVIEW_URL || process.env.PREVIEW_DEPLOYMENT_URL;
            const body = [
              marker,
              `### Cloudflare preview — \`${process.env.EXAMPLE}\``,
              '',
              url
                ? `🔗 ${url}`
                : 'Preview deployed, but no URL was reported.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
