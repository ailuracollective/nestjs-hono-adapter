---
name: Cloudflare examples

# Deploys the two Cloudflare Workers examples from here instead of
# Workers Builds, which keeps resetting the preview command and the
# root directory. `main` deploys; every other ref uploads a Preview
# named after its branch.
'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-examples.yml'
      - 'examples/**'
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    paths:
      - '.github/workflows/cloudflare-examples.yml'
      - 'examples/**'
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: ${{ matrix.example }}
    # A pull request from a fork has no secrets to deploy with.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        example: [node, fetch]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Deploy ${{ matrix.example }} to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          config="examples/cloudflare/${{ matrix.example }}/wrangler.jsonc"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bunx wrangler preview --config "$config" \
              --name "${{ github.head_ref }}"
          else
            bunx wrangler deploy --config "$config"
          fi
