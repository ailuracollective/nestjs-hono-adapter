---
name: Feature
description: Add a new capability or behavior.
title: 'feat: '
labels:
  - type/feature
  - status/needs-review
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description:
        Why this work exists. Include evidence or current
        behavior when it materially affects the task.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The observable outcome required.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue includes.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] The new behavior is available as described.
        - [ ] Existing behavior that must remain unchanged is preserved.
        - [ ] Relevant tests cover the new behavior.
        - [ ] Documentation is updated when public behavior or configuration changes.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description:
        Only include when an explicit boundary prevents
        ambiguity.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description:
        Only constraints that materially limit valid solutions.

  - type: textarea
    id: references
    attributes:
      label: References
      description: >-
        Links or paths to authoritative context. A path is a
        navigation hint unless the issue explicitly states that
        modifying that file is required.
