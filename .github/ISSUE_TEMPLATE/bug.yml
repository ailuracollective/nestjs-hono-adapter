---
name: Bug Fix
description: Correct behavior that does not match the expected behavior.
title: "fix: "
labels:
  - type/bug
  - status/needs-review
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters. Include evidence or current behavior when it materially affects the task.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The observable outcome required.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue includes.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] The incorrect behavior no longer occurs.
        - [ ] Expected behavior is verified by an appropriate test.
        - [ ] Existing behavior outside the fix remains unchanged.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Only include when an explicit boundary prevents ambiguity.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Only constraints that materially limit valid solutions.

  - type: textarea
    id: references
    attributes:
      label: References
      description: >-
        Links or paths to authoritative context. A path is a navigation hint
        unless the issue explicitly states that modifying that file is required.

  - type: textarea
    id: observed-behavior
    attributes:
      label: Observed behavior
      description: What currently happens.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest reliable reproduction.
