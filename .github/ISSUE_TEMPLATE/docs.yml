---
name: Documentation
description: Add or update project documentation.
title: "docs: "
labels:
  - type/documentation
  - status/needs-review
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this work exists. Include evidence or current behavior when it materially affects the task.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The observable outcome required. What should readers understand or be able to do?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue includes.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Documented behavior matches the implementation.
        - [ ] The intended audience can understand the documentation.
        - [ ] Relevant examples or configuration details are included when needed.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Only include when an explicit boundary prevents ambiguity.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Only constraints that materially limit valid solutions.

  - type: textarea
    id: references
    attributes:
      label: References
      description: >-
        Links or paths to authoritative context. A path is a navigation hint
        unless the issue explicitly states that modifying that file is required.
