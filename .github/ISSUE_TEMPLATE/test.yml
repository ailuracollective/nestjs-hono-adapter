---
name: Testing
description: Add or improve automated test coverage.
title: "test: "
labels:
  - type/task
  - status/needs-review
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this work exists. What behavior or risk is the added coverage intended to establish?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The observable outcome required.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue includes.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Relevant behavior is covered by automated tests.
        - [ ] Important success scenarios are covered.
        - [ ] Important failure or boundary scenarios are covered.
        - [ ] Tests are deterministic and maintainable.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: Only include when an explicit boundary prevents ambiguity.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Only constraints that materially limit valid solutions.

  - type: textarea
    id: references
    attributes:
      label: References
      description: >-
        Links or paths to authoritative context. A path is a navigation hint
        unless the issue explicitly states that modifying that file is required.
