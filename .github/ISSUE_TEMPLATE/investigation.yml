---
name: Investigation
description:
  Investigate a question or uncertainty before implementation.
title: 'spike: '
labels:
  - type/task
  - status/needs-review
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description:
        Why this work exists. What led to this investigation?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The observable outcome required.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What this issue includes.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] The question is answered with evidence.
        - [ ] Relevant alternatives are evaluated.
        - [ ] A recommendation is documented.
        - [ ] Implementation work is tracked separately when appropriate.
    validations:
      required: true

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description:
        Only include when an explicit boundary prevents
        ambiguity.

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description:
        Only constraints that materially limit valid solutions.

  - type: textarea
    id: references
    attributes:
      label: References
      description: >-
        Links or paths to authoritative context. A path is a
        navigation hint unless the issue explicitly states that
        modifying that file is required.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What needs to be answered?
    validations:
      required: true

  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description:
        What the investigation should produce (findings,
        recommendation, decision).
    validations:
      required: true
